<div class="section-header">
    <div>
        <h2>Criar nova transação</h2>
        <p>Preencha os dados para registrar uma nova receita ou despesa.</p>
    </div>
</div>

<form class="transaction-form" id="transactionForm" autocomplete="off" method="post">
    <div class="form-group">
        <label for="description">Descrição</label>
        <input 
            type="text" 
            id="description" 
            name="description" 
            placeholder="Ex: Salário, mercado, transporte"
            required
            maxlength="50"
        >
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="amount">Valor</label>
            <input 
                type="number" 
                id="amount" 
                name="amount" 
                placeholder="0,00"
                step="0.01"
                min="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label for="type">Tipo</label>
            <select id="type" name="type" required>
                <option value="">Selecione</option>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="category">Categoria</label>
            <select id="category" name="category" required>
                <option value="">Selecione</option>
                <option value="trabalho">Trabalho</option>
                <option value="alimentacao">Alimentação</option>
                <option value="transporte">Transporte</option>
                <option value="moradia">Moradia</option>
                <option value="lazer">Lazer</option>
                <option value="outros">Outros</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Data</label>
            <input 
                type="date" 
                id="date" 
                name="date" 
                required
            >
        </div>
    </div>

    <div class="form-actions">
        <button type="reset" class="btn-secondary">Limpar</button>
        <button type="submit" id="submit-form" class="btn-primary">Salvar transação</button>
    </div>
</form>
