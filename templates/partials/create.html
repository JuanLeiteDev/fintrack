<div class="section-header">
    <div>
        <h2>Criar nova transação</h2>
        <p>Preencha os dados para registrar uma nova receita ou despesa.</p>
    </div>
</div>

<form class="transaction-form" id="transactionForm" autocomplete="off" method="post">
    <div class="form-group">
        <label for="description">Descrição</label>
        <input 
            type="text" 
            id="description" 
            name="description" 
            placeholder="Ex: Salário, mercado, transporte"
            required
            maxlength="50"
        >
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="amount">Valor</label>
            <input 
                type="number" 
                id="amount" 
                name="amount" 
                placeholder="0,00"
                step="0.01"
                min="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label for="type">Tipo</label>
            <select id="type" name="type" required>
                <option value="">Selecione</option>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="category">Categoria</label>
            <select id="category" name="category" required maxlength="50">
                <option value="">Selecione</option>
                <option value="Alimentação">Alimentação</option>
                <option value="Animais de estimação">Animais de estimação</option>
                <option value="Bônus">Bônus</option>
                <option value="Câmbio">Câmbio</option>
                <option value="Compras">Compras</option>
                <option value="Construção">Construção</option>
                <option value="Contas">Contas</option>
                <option value="Doações e caridade">Doações e caridade</option>
                <option value="Educação">Educação</option>
                <option value="Gift card">Gift card</option>
                <option value="Imposto">Imposto</option>
                <option value="Investimento">Investimento</option>
                <option value="Juros e multa">Juros e multa</option>
                <option value="Lazer">Lazer</option>
                <option value="Mercado">Mercado</option>
                <option value="Moradia">Moradia</option>
                <option value="Outros">Outros</option>
                <option value="Saúde">Saúde</option>
                <option value="Seguros">Seguros</option>
                <option value="Sem categoria">Sem categoria</option>
                <option value="Serviços">Serviços</option>
                <option value="Trabalho">Trabalho</option>
                <option value="Transporte">Transporte</option>
                <option value="Vestuário">Vestuário</option>
                <option value="Vendas">Vendas</option>
                <option value="Viagem">Viagem</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Data</label>
            <input 
                type="date" 
                id="date" 
                name="date" 
                required
            >
        </div>
    </div>

    <div class="form-actions">
        <button type="reset" class="btn-secondary">Limpar</button>
        <button type="submit" id="submit-form" class="btn-primary">Salvar transação</button>
    </div>
</form>
