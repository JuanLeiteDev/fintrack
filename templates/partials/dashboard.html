<div class="section-header">
    <div>
        <h2>Dashboard</h2>
        <p>Resumo visual das suas receitas, despesas e saldo atual.</p>
    </div>
</div>

<div class="dashboard-summary">
    <article class="summary-item">
        <span>Saldo atual</span>
        <strong id="balance-txt">€ 0,00</strong>
    </article>

    <article class="summary-item">
        <span>Receitas</span>
        <strong id="income-txt">€ 0,00</strong>
    </article>

    <article class="summary-item">
        <span>Despesas</span>
        <strong id="expense-txt">€ 0,00</strong>
    </article>
</div>

<div class="charts-area">
    <div class="chart-box">
        <h3>Receitas x despesas</h3>
        <div class="chart-canvas">
            <canvas id="incomeExpenseChart" width="320" height="260"></canvas>
        </div>
    </div>

    <div class="chart-box">
        <h3>Despesas por categoria</h3>
        <div class="chart-canvas">
            <canvas id="categoryChart" width="320" height="260"></canvas>
        </div>
    </div>
</div>
