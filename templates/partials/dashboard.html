<div class="section-header">
    <div>
        <h2>Dashboard</h2>
        <p>Resumo visual das suas receitas, despesas e saldo atual.</p>
    </div>
</div>

<div class="dashboard-summary">
    <article class="summary-item">
        <span>Saldo atual</span>
        <strong id="balance-txt">€ 0,00</strong>
    </article>

    <article class="summary-item">
        <span>Receitas</span>
        <strong id="income-txt">€ 0,00</strong>
    </article>

    <article class="summary-item">
        <span>Despesas</span>
        <strong id="expense-txt">€ 0,00</strong>
    </article>
</div>

<div class="charts-area">
    <div class="chart-box">
        <h3>Receitas e despesas</h3>
        <canvas id="incomeExpenseChart"></canvas>
    </div>

    <div class="chart-box">
        <h3>Distribuição por categoria</h3>
        <canvas id="categoryChart"></canvas>
    </div>
</div>
