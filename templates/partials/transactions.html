<div class="section-header" id="diferente">
    <div>
        <h2>Transações</h2>
        <p>Lista das receitas e despesas registradas.</p>
    </div>

    <div class="section-actions">
        <button type="button" id="filter" class="btn-secondary">Filtrar</button>
        <a href="#create-transaction" class="btn-primary">Nova transação</a>
    </div>
</div>

<div class="filters-panel hidden" id="filtersPanel">
    <div class="filters-header">
        <div>
            <h3>Filtros</h3>
            <p>Refine a lista de transações.</p>
        </div>

        <button type="button" class="filters-close" id="closeFilters">
            ×
        </button>
    </div>

    <div class="filters-grid">
        <div class="filter-group">
            <label for="filterDescription">Descrição</label>
            <input 
                type="text" 
                id="filterDescription" 
                placeholder="Ex: mercado, salário..."
            >
        </div>

        <div class="filter-group">
            <label for="filterCategory">Categoria</label>
            <select id="filterCategory">
                <option value="">Todas</option>
                <option value="Alimentação">🍽️ Alimentação</option>
                <option value="Animais de estimação">🐶 Animais de estimação</option>
                <option value="Bônus">🎁 Bônus</option>
                <option value="Câmbio">💱 Câmbio</option>
                <option value="Compras">🛒 Compras</option>
                <option value="Construção">🏗️ Construção</option>
                <option value="Contas">🧾 Contas</option>
                <option value="Doações e caridade">🤝 Doações e caridade</option>
                <option value="Educação">🎓 Educação</option>
                <option value="Gift card">💳 Gift card</option>
                <option value="Imposto">🏛️ Imposto</option>
                <option value="Investimento">📈 Investimento</option>
                <option value="Juros e multa">⚠️ Juros e multa</option>
                <option value="Lazer">🎮 Lazer</option>
                <option value="Mercado">🛍️ Mercado</option>
                <option value="Moradia">🏠 Moradia</option>
                <option value="Outros">📦 Outros</option>
                <option value="Saúde">🩺 Saúde</option>
                <option value="Seguros">🛡️ Seguros</option>
                <option value="Sem categoria">❔ Sem categoria</option>
                <option value="Serviços">🛠️ Serviços</option>
                <option value="Trabalho">💼 Trabalho</option>
                <option value="Transporte">🚗 Transporte</option>
                <option value="Vestuário">👕 Vestuário</option>
                <option value="Vendas">💰 Vendas</option>
                <option value="Viagem">✈️ Viagem</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterType">Tipo</label>
            <select id="filterType">
                <option value="">Todos</option>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterDateStart">Data inicial</label>
            <input type="date" id="filterDateStart">
        </div>

        <div class="filter-group">
            <label for="filterDateEnd">Data final</label>
            <input type="date" id="filterDateEnd">
        </div>

        <div class="filter-group">
            <label for="filterValueMin">Valor mínimo</label>
            <input 
                type="number" 
                id="filterValueMin" 
                placeholder="0,00" 
                min="0" 
                step="0.01"
            >
        </div>

        <div class="filter-group">
            <label for="filterValueMax">Valor máximo</label>
            <input 
                type="number" 
                id="filterValueMax" 
                placeholder="0,00" 
                min="0" 
                step="0.01"
            >
        </div>
    </div>

    <div class="filters-actions">
        <button type="button" class="btn-secondary" id="clearFilters">
            Limpar filtros
        </button>
    </div>
</div>

<div class="transactions-list">
    
</div>
